NPC.jory = { name: 'Jory Lamb', mono: 'JL', hue: 60, role: 'Debtor. Keeps the dice ring on the yard step.',
  here: function () { return ldOn(); },
  start: function () { return S.seen.talk_jory ? 'hub' : 'start'; },
  nodes: {
    start: { say: 'Under the lip of the yard step, out of the rain and out of the turnkeys’ line of sight, a man with ink-black fingernails throws bone dice against the wall and catches them on the rebound.\n\n“Jory Lamb. In for debts, out never.” He holds one up to the grey light. “You know the trick of these? Throw a face and it fattens. The face behind it starves. Every die on the Row is a little history of whoever held it.” He grins. “Mine are very well fed.”',
      voices: [{ v: 'tally', text: 'He keeps a tally of the Row’s dice the way the Governor keeps a tally of the Row. Every die, every face, every throw.' }, { v: 'patter', text: 'A man who runs a game always knows the odds. The trick is finding the game where he doesn’t.' }],
      opts: [{ q: '“Show me the game.”', go: function () { ldRing(); } }, { q: '“Who’s trading dice?”', go: function () { ldTrade(); } }, { q: '“What’s that you keep tucked in your cheek?”', to: 'hang', show: function () { return !S.ld.hangGot; } }, { q: '“Got anything stranger?”', to: 'blank', show: function () { return !S.ld.blankGot; } }, { q: 'Leave him to it.', to: '<' }] },
    hub: { say: function () { return '“Back for the bones?” Jory rattles a pair of them in his fist. ' + (S.ld.hangGot ? '“How is my old friend treating you? You can feel it getting colder, can’t you?”' : '“Stakes are tobacco. High face wins, ties are nobody’s.”'); },
      opts: [{ q: '“Show me the game.”', go: function () { ldRing(); } }, { q: '“Who’s trading dice?”', go: function () { ldTrade(); } }, { q: '“That thing in your cheek. Let me see it.”', to: 'hang', show: function () { return !S.ld.hangGot; } }, { q: '“Got anything stranger?”', to: 'blank', show: function () { return !S.ld.blankGot; } }, { q: 'Leave him to it.', to: '<' }] },
    blank: { say: 'Jory turns out a pocket and picks a die out of the lint. It is pale and very plain, and every one of its faces shows a single pip.\n\n“The Blank. Somebody filed it down to nothing, a long time ago. Nobody wants it: it loses to everything.” He weighs it. “At first. Throw it and the faces start to argue. One climbs, the one behind it digs. A die like that ends up being whatever you made it.”',
      opts: [{ q: 'Take it off his hands.', h: 'Tobacco −1.', need: function () { return S.tob >= 1; }, why: 'You need 1 tobacco.', go: function () { ldGetBlank(true); } }, { q: '“Not today.”', to: 'hub' }] },
    hang: { say: 'He spits a die into his palm. It is darker than the others, yellow-grey, and there is not a low number on it anywhere.\n\n“The Hangman’s Die. Off a man they dropped in the yard, before your time. It wins. It wins and wins.” He closes his hand on it. “Then it stops. Every face it lands on fattens, and the face behind starves twice as fast. Sooner or later there is nothing on it but debt.” He shrugs. “Five tobacco. Or throw me for it, if you are feeling lucky.”',
      voices: [{ v: 'choir', text: 'We know that die. Every one of us threw it once.' }, { v: 'tally', min: 2, text: 'Forty-two pips on it now. Each throw costs it one. Count your throws.' }],
      opts: [{ q: 'Buy it.', h: 'Tobacco −5.', need: function () { return S.tob >= 5; }, why: 'You need 5 tobacco.', go: ldBuyHang },
        { q: '“I’ll throw you for it.”', h: 'Your left-hand die against his house die. If you lose, he keeps the die you threw.', go: ldThrowHang },
        { q: '“Not today.”', to: 'hub' }] }
  } };

var LOCS = {};

LOCS.cell = { name: 'Cell Nine, Condemned Row', short: 'Cell Nine', amb: 'assets/amb/cave.mp3', night: true,
  desc: function () {
    if (lockdown()) return 'Lock-up. The lamp in the corridor has been turned down to a bead of yellow, and Condemned Row has gone quiet in the way of men who are not asleep. Water runs down the back wall in a sheet as thin as paper and goes away into the drain in the floor.\n\nBask walks the Row with his lantern until two in the morning. After that there is only the dark and the drip.';
    return 'Cell Nine is seven feet by five, cut into the living rock under Fort Malice. A stone shelf for a bed, a bucket, an iron grate in the floor over a drain that talks to itself, and a door of oak and strap-iron with a hatch at eye level. The number 9 is painted above it in red lead, and somebody has scratched a little gallows next to it.\n\nThrough the bars of the next cell, Tobit Fennick is drawing on a slate.';
  },
  voices: function () { return [
    { v: 'bell', show: function () { return !S.seen.obj_cell_nine; }, text: 'Nine. You have been here before. Not here: there. Redoubt Nine, where the courier dug himself out of the clay. Look at the number.' },
    { v: 'damp', max: 2, show: function () { return S.st <= 4; }, text: 'Lie down. The shelf is wet, but you are wet already. Nobody needs you for anything for hours.' },
    { v: 'count', min: 2, text: function () { return 'Seventy-two hours, they said. ' + Math.max(0, DEADLINE - S.hrs) + ' left. Scratch it on the wall. A number you can see is a number you can beat.'; } },
    { v: 'drain', min: 2, show: function () { return lockdown(); }, text: 'Drip. Boots: two pair, far end, going away. Drip. A key in a lock that is not yours. Drip.' }
  ]; },
  people: ['tobit', 'bask'],
  objs: [
    { id: 'nine', name: 'The number above the door', blurb: 'Red lead and a scratched gallows.', text: 'A 9 in red lead, the paint run a little at the bottom as though the number had been crying. Next to it, the little scratched gallows. Underneath, very small, other men’s initials: eleven sets of them, the oldest worn almost smooth.',
      voices: [{ v: 'bell', text: 'Redoubt Nine fell the week the courier came. The guns ran out of cadence and the earth gave up its dead. Now you are in Nine, and the earth is very patient.' }, { v: 'choir', text: 'Eleven of us. Here, here, here. Put yours under. There is room.' }],
      first: { thought: 'cellnine' } },
    { id: 'wall', name: 'The back wall', blurb: 'Wet stone and scratches.', text: 'Water sheets down the rock, cold enough to hurt your fingers. Where it is dry, near the shelf, the stone is covered with scratches in groups of five: days, or hours, or loaves. One man drew a ship. One man wrote a name, again and again, getting smaller. A woman’s name.',
      voices: [{ v: 'count', text: 'They all counted. Some counted to the end and some counted past it. You do not know which, from the marks. That is the point of marks.' }, { v: 'pick', min: 3, text: 'The mortar between the stones by the door is soft as cheese. Not soft enough to dig out in three days. Soft enough to hide a key in.' }] },
    { id: 'drain', name: 'The drain', blurb: 'An iron grate in the floor.', text: 'A grate the size of a dinner plate, rusted into the stone, over a black throat that goes down to the river. It carries every sound in Malice down to you, eventually: boots, keys, a cough three cells away, the yard pump, the Governor’s bell. At night it is louder than the day.',
      voices: [{ v: 'drain', text: 'Put your ear to me. At night. I will tell you how the night works.' }, { v: 'damp', text: 'Down there is the river. The river is going somewhere, at least.' }],
      acts: function () { return [
        { id: 'listen', t: 'Lie with your ear to the grate and learn the night', h: 'Only during lock-up. Learn the lamp, the keys and the boots.', v: 'drain', dc: 8, hrs: 2, show: function () { return !S.f.rota; }, need: lockdown, why: 'The day is too loud. Wait for lock-up.',
          ok: { text: 'You lie on the wet stone for two hours and let the Drain talk. The lamp on the bell tower ticks round every quarter-hour; you hear its shutter. Bask on the half and the hour. Another pair of boots, heavier, on the wall at two and at four. Between the half and the hour, with the lamp past the tower angle, there is a gap of about eleven minutes when nobody is looking at the yard. Only the rats.', set: { rota: true }, thought: 'rats' },
          bad: { text: 'Two hours of drips and boots and no pattern you can hold. Your ear is numb and your hip has set like cement.', fx: { st: -1 } } }
      ]; } },
    { id: 'door', name: 'The door', blurb: 'Oak and strap-iron.', text: 'Three inches of oak, banded with iron, hung on pins as thick as your thumb. The lock is an old warded box-lock, big and simple, the sort that has been opening and closing on men for a hundred years without ever once being surprised.',
      voices: [{ v: 'pick', text: 'Simple wards. Big keyway. A stiff wire and an hour of patience would do it. A proper key would do it in a breath.' }, { v: 'gall', text: 'Iron. It remembers your wrists. It is looking forward to your neck.' }] }
  ],
  acts: function () { return [
    { id: 'eat', t: 'Eat a crust', h: 'Stamina +2. Bread −1.', need: function () { return S.bread > 0; }, why: 'No bread.', show: function () { return S.st < 10; }, run: function (c) { applyFx({ bread: -1, st: 2 }, c); S.hunger = 0; }, ok: { text: 'You eat it slowly, the way the Row taught you, crumb by crumb with your hand cupped under your chin.' } },
    { id: 'rest', t: 'Lie on the shelf for a while', h: 'Two hours. Stamina +2.', hrs: 2, show: function () { return !lockdown(); }, run: function (c) { applyFx({ st: 2 }, c); }, ok: { text: 'You lie on your back and watch the water come down the wall. Your body takes the rest the way dry ground takes rain.' } },
    { id: 'wait', t: 'Stay awake an hour', h: 'Bask walks the Row until two.', hrs: 1, show: function () { return lockdown(); }, ok: { text: 'You sit with your back to the door and listen to Malice breathe.' } },
    { id: 'sleep', t: 'Sleep until the six o’clock bell', h: 'Stamina restored, Health +1.', show: function () { return lockdown(); },
      run: function (c) { var h = hourOfDay(), n = h >= 21 ? 30 - h : 6 - h; S.sleeping = true; passTime(n, c); S.sleeping = false; applyFx({ st: 8, hp: 1 }, c); },
      ok: { title: 'Sleep', text: function () { return pick(['You dream of the Oakhaven counting-house, the long desks, columns that always added up. You wake to the bell and the drip.', 'You dream you are carrying a tin case down a road in the rain, and the case is very light, and you are afraid to open it. The bell wakes you.', 'No dreams. The six o’clock bell drags you up out of the dark like a bucket out of a well.']); } } },
    { id: 'outkey', t: 'Turn Tobit’s key in your own door', h: 'Out into the dark Row. Back before six.', show: function () { return lockdown() && has('key'); }, run: function (c) { S.sneak = true; sfx('lock', .5); }, ok: { text: 'You oil it with grease from your hair and turn it slow, as Tobit said. It does not scream. The door opens on a corridor full of nothing.' } },
    { id: 'outwire', t: 'Work the lock with your bent wire', h: 'Out into the dark Row. If you fail, the Row hears it.', show: function () { return lockdown() && has('wire') && !has('key'); }, v: 'pick', dc: 9,
      ok: { text: 'Forty minutes on your knees with the wire and your eyes shut, feeling for the wards. Then the bolt goes back with a sound like a knuckle cracking, and the door is open.', run: function () { S.sneak = true; } },
      bad: { text: 'The wire slips and rings against the box-lock. Down the Row somebody calls out. You hear boots, and pull your hand in, and lie on the shelf with your heart going until they go away again.', fx: { watch: 1, hrs: 1 } } }
  ]; } };

LOCS.yard = { name: 'The Exercise Yard', short: 'The yard', amb: 'assets/amb/rain_in.mp3', open: open(8, 18), hours: 'Open 08:00 to 18:00',
  desc: function () { return 'A well of grey sky with Malice’s walls going up on every side, wet and black. The flags are worn into a shallow track by a hundred years of men walking in a circle. An iron grate splits the yard in two: the men’s half, and beyond it the women’s ward. At the north corner the bell tower rises where the wall drops lowest, and on its top a lamp in a cage waits for the night.' + (S.hrs >= 40 ? '\n\nIn the middle of the yard, carpenters are building a gallows. They whistle while they work.' : ''); },
  voices: function () { return [
    { v: 'tally', min: 2, text: 'Two turnkeys at the gate. One on the wall walk. Forty men in this half, nineteen in the other. The lamp on the tower is out by day. The wall is lowest at the tower angle: twenty-four feet, give or take.' },
    { v: 'knuckles', show: function () { return !S.f.brannockSettled && S.f.brannockGrudge; }, text: 'Brannock has not forgotten. He is waiting for you to forget.' },
    { v: 'choir', show: function () { return S.hrs >= 40; }, text: 'They are building it to your height. They always measure. Isn’t that kind?' },
    { v: 'ward', min: 2, text: 'Men nod to you as they pass on the circle. Somebody leaves half a pipe on the step where you will sit.' }
  ]; },
  people: ['brannock', 'ysolde', 'comrade', 'jory'],
  objs: [
    { id: 'tower', name: 'The bell tower and the lamp', blurb: 'The lowest part of the wall.', text: 'The tower carries the chapel bell and, on its top, a lantern in an iron cage with a shutter that turns. Where the tower meets the curtain wall the stone is rough and old and the wall is barely four men high. On the far side, you know, is the ditch, and then the Tanner river.',
      voices: [{ v: 'count', text: 'Twenty-four feet. A man with a rope and nothing to lose. Men have done more with less.' }, { v: 'pick', text: 'At the foot of the tower, a little postern door, iron-bound. Square keyhole. The long key with the square bow on Bask’s ring.' }],
      acts: function () { return [
        { id: 'study', t: 'Walk the circle and count the wall', h: 'Learn when the walls are watched.', v: 'tally', dc: 9, hrs: 2, show: function () { return !S.f.rota; },
          ok: { text: 'Six times round the circle, counting. The wall-walk turnkey reaches the tower angle on the even hour and stays a quarter-hour out of the wind. Corporal Mott does the night rounds; the day man complains about him. From what he says, Mott walks at two and four, and Bask keeps the Row on the half and the hour. The lamp turns every quarter. Somewhere in there is a gap.', set: { rota: true } },
          bad: { text: 'You count, and lose count, and count again. A turnkey starts watching you count.', fx: { watch: 1 } } }
      ]; } },
    { id: 'gallows', name: 'The carpenters', blurb: 'New timber in the middle of the yard.', show: function () { return S.hrs >= 40; }, text: 'Two carpenters, a pile of new pine, and a coil of rope sitting on a trestle like a sleeping dog. They have built a lot of these. One of them looks you up and down without unkindness, the way a tailor would.',
      voices: [{ v: 'choir', text: 'Don’t be frightened. It’s very quick if the carpenter likes you. Be nice to the carpenter.' }, { v: 'damp', text: 'At least it would be over.' }, { v: 'count', min: 3, text: 'It is not over. Not until the bell. Count.' }] },
    { id: 'grate', name: 'The grate', blurb: 'Iron between the men and the women.', text: 'Bars as thick as your wrist, set in lead, too close for a head. Things pass through it anyway: bread, notes, tobacco, gossip, once (the Row says) a baby. On the far side the women’s ward has its own door, and its own lock, the same old box-lock as yours.',
      voices: [{ v: 'ward', text: 'The grate is the only place in Malice where both halves of the gaol can speak. Everything that matters crosses here.' }] }
  ],
  acts: function () { return [
    { id: 'share', t: 'Break your bread and pass it round the circle', h: 'Bread −1, Yard trust +1.', need: function () { return S.bread > 0; }, why: 'You have no bread.', show: function () { return (S.f.shared || 0) < 3; },
      run: function (c) { applyFx({ bread: -1, yard: 1 }, c); S.f.shared = (S.f.shared || 0) + 1; tally('loyal'); if (S.f.shared >= 2) newThought('breadcoin', c); },
      ok: { text: 'You tear it into as many pieces as there are hands near you. It is very little bread, for a great many hands. Nobody says thank you. That is how you know it counted.' } },
    { id: 'riot', t: 'Give Brannock the word', h: 'Forty men, a gate made of boys, and the river beyond. This cannot be taken back.', show: function () { return S.f.brannockAlly && S.yard >= 2; }, v: 'knuckles', dc: 10, red: true,
      extra: function () { return [['Yard trust', S.yard - 1], ['Kitchen knife', has('knife') ? 1 : 0], ['Ysolde opens the women’s side', S.f.ysoldeFriend ? 1 : 0]]; },
      ok: { go: function () { ending('riot'); } }, bad: { go: function () { ending('riotfail'); } } }
  ]; } };

LOCS.chapel = { name: 'The Gaol Chapel', short: 'Chapel', amb: 'assets/amb/cave.mp3', open: open(7, 21), hours: 'Open 07:00 to 21:00',
  desc: 'A low vault with whitewashed walls gone grey, four rows of benches, and an altar no bigger than a kitchen table. Candles, fewer than there should be. In the vestry corner the bell rope comes down through a hole in the ceiling and hangs in a loop on an iron hook, thick as your wrist and black with tar.\n\nThis is where the Assize will sit. They will move the altar.',
  voices: function () { return [
    { v: 'bowed', text: 'Kneel. It costs you nothing and every turnkey who sees it will think you a little less dangerous.' },
    { v: 'bell', text: 'Up there. Above you. Every hour I tell them how many you have left. I am sorry. It is my job.' },
    { v: 'writ', min: 1, text: 'The royal arms are painted over the altar. Faded, but there. You served those arms. They have not finished with you yet.' }
  ]; },
  people: ['quill'],
  objs: [
    { id: 'rope', name: 'The bell rope', blurb: 'Tarred hemp on a hook.', text: 'It goes up through the ceiling to the bell. Thirty feet of it, at least, heavy and greasy with tar. The loop on the hook is tied off with a sailor’s knot. Below the hook, scratched into the plaster, someone has written: RANG BY ITSELF. And a date: the night before the ford.',
      voices: [{ v: 'pick', text: 'Cut it above the hook and the bell goes silent and the whole gaol knows. Cut it high, by the hole, and leave the loop: the bell still rings, short. Nobody looks up.' }, { v: 'count', text: 'Thirty feet. The wall at the tower angle is twenty-four.' }, { v: 'bell', text: 'If you take my rope I cannot count for you any more. That might be a kindness.' }],
      acts: function () { return [
        { id: 'cut', t: 'Climb the vestry shelves and saw through the rope up by the hole', h: 'You need a blade.', need: function () { return has('knife'); }, why: 'You need a blade: the kitchens have knives.', show: function () { return !has('rope') && !S.f.ropeCut; }, v: 'pick', dc: 8,
          ok: { text: 'You go up the shelves like a cat and saw the rope through by the hole where nobody looks. Thirty feet of hemp comes down into your arms. You coil it round your waist under your shirt and you are suddenly very fat and very frightened. The bell will ring short tomorrow. Nobody will look up.', give: ['rope'], set: { ropeCut: true } },
          bad: { text: 'Your foot goes through a shelf. Hymn books everywhere. Quill comes out of the vestry and finds you on the floor in a drift of psalms, with a bread knife. He takes the knife. He says nothing to anybody, which is somehow worse.', take: ['knife'], fx: { crown: -1, watch: 1 } } }
      ]; } },
    { id: 'candles', name: 'The candles', blurb: 'Fewer than there should be.', text: 'Tallow mostly, a few beeswax at the altar for show. The candle-ends go into a box by the door, to be melted down and counted again. The Governor’s secretary counts them, the label says, in a neat green hand.',
      voices: [{ v: 'cipher', text: 'Green ink. Cipher-room green. Who on the Governor’s staff has cipher-room ink?' }, { v: 'pick', text: 'Warm wax takes a print. Of anything. A thumb, a seal, a key.' }],
      first: { set: { knowGreen: true } },
      acts: function () { return [
        { id: 'pocket', t: 'Pocket a handful of candle-ends', h: 'Quick fingers.', show: function () { return !has('wax') && !has('impress') && !has('key'); }, v: 'pick', dc: 7,
          ok: { text: 'Into your sleeve, warm against your wrist. Nobody counts the ends until Friday.', give: ['wax'] },
          bad: { text: 'Quill turns round as your hand is in the box. “Ask,” he says mildly. “You only have to ask.”', fx: { watch: 1 } } }
      ]; } },
    { id: 'register', name: 'The burial register', blurb: 'A ledger on a lectern.', text: 'The chaplain’s register of the dead of Malice, in his own careful brown hand. Name, date, cause, and a little cross. This season there are eleven entries marked Assize. Beside each, in pencil, very small, Quill has written what the man said last. Most of them asked him to write to someone.',
      voices: [{ v: 'choir', text: 'That’s me. And me. And that one there with the blot is me, I was shaking.' }, { v: 'tally', min: 2, text: 'Eleven Assize entries. All in the last four months. All on Thursdays.' }, { v: 'writ', text: 'Every one of them was the Crown’s business. The Crown kept proper records. That is what makes it the Crown.' }] }
  ],
  acts: function () { return [
    { id: 'service', t: 'Kneel through the noon office', h: 'Be seen. Crown +1, Stamina +1.', hrs: 1, once: true, need: open(11, 14), why: 'The office is at noon.',
      run: function (c) { applyFx({ crown: 1, st: 1 }, c); tally('meek'); }, ok: { text: 'Quill reads the office to four prisoners and two turnkeys. You kneel through all of it. One of the turnkeys notices, and nods, and writes something in his book.' } }
  ]; } };

LOCS.kitchen = { name: 'The Bakehouse', short: 'Bakehouse', amb: 'assets/amb/cave.mp3', open: function () { var h = hourOfDay(); return (h >= 6 && h < 10) || (h >= 16 && h < 20); }, hours: 'Work details 06:00–10:00 and 16:00–20:00',
  desc: 'Two great brick ovens breathing in the dark, and a long table white with flour where the work-detail prisoners knead the day’s bread under the eye of the cook, a vast woman called Mother Gage who has a ladle on a cord round her neck like a badge of office. It is warm here. Everyone who works here is fatter than anyone who does not.',
  voices: function () { return [
    { v: 'tally', text: 'Loaves out: two hundred and six. Loaves counted: two hundred. Six vanish every bake. Mother Gage knows exactly where.' },
    { v: 'damp', text: 'Stay by the oven. Just stay by the oven forever.' },
    { v: 'pick', min: 2, text: 'Bread knives on a board by the trough, counted twice a shift. Mother Gage’s cupboard, padlocked. Gin, by the smell of the keyhole.' }
  ]; },
  people: [],
  objs: [
    { id: 'chute', name: 'The slop chute', blurb: 'A stone gullet in the wall.', text: 'Waste goes down a stone chute in the corner to the river. It is about as wide as a cat. Something living is down there; it squeaks.',
      voices: [{ v: 'damp', text: 'The river is down there. All this water is going to the river. Wouldn’t you like to go with it?' }, { v: 'count', text: 'Too narrow for a man. Do not think about it.' }] },
    { id: 'gage', name: 'Mother Gage', blurb: 'The ladle and the cupboard.', text: 'She does not talk to prisoners. She talks at them, with the ladle. But she watches the work-detail with a cook’s eye, and she gives a crust to anybody who keeps up with the trough, and twice as much to anybody who does not complain.',
      voices: [{ v: 'bowed', text: 'Work. Do not talk. Let her see you work.' }] }
  ],
  acts: function () { return [
    { id: 'work', t: 'Knead with the work detail', h: function () { return 'Two hours. Bread +' + (perk('breadcoin') ? 3 : 2) + ', Stamina −1.'; }, hrs: 2,
      run: function (c) { applyFx({ bread: perk('breadcoin') ? 3 : 2, st: -1 }, c); }, ok: { text: 'Two hours up to your elbows in dough with the oven roaring at your back. Mother Gage slaps two crusts into your hands at the end of it without looking at you.' } },
    { id: 'knife', t: 'Lift a bread knife from the board', h: 'If the count comes up short while you are in the room, they will search the room.', show: function () { return !has('knife') && !S.f.knifeTaken; }, v: 'pick', dc: 8,
      ok: { text: 'Into your sleeve while Mother Gage is shouting at someone else. The count comes up one short at the end of the shift, and she shouts some more, and nobody is searched because nobody ever is on a Wednesday.', give: ['knife'], set: { knifeTaken: true } },
      bad: { text: 'Mother Gage’s ladle comes down on your wrist like a judgement. She takes the knife and says something to the turnkey at the door.', fx: { hp: -1, watch: 1 } } },
    { id: 'gin', t: 'Pick Mother Gage’s cupboard', h: 'A padlock and a bottle.', show: function () { return !has('gin') && !S.f.ginTaken; }, v: 'pick', dc: 9,
      ok: { text: 'A twist of wire, a breath held, and the padlock opens like a mouth. Half a bottle of Oakhaven gin goes down the front of your shirt.', give: ['gin'], set: { ginTaken: true } },
      bad: { text: 'The padlock does not give, and Mother Gage turns round. She does not hit you. She looks at you with enormous disappointment and sends you back to the Row without your crust.', fx: { watch: 2 } } }
  ]; } };

LOCS.infirmary = { name: 'The Infirmary', short: 'Infirmary', amb: 'assets/amb/cave.mp3', open: open(8, 21), hours: 'Open 08:00 to 21:00',
  desc: 'The long vault under the old magazine: six cots, a brazier, a table of instruments under a cloth, and a shelf of brown bottles with paper labels. It smells of carbolic and something under the carbolic. Two of the cots have men in them who are going to get better. One has a man who is not. One has a sheet over it.',
  voices: function () { return [
    { v: 'gall', text: 'Warm. The rings on your wrists stop shouting for the first time in days.' },
    { v: 'pick', min: 2, text: 'Instruments under that cloth. Probes, needles, a bone saw. A steel probe bends.' }
  ]; },
  people: ['hesketh'],
  objs: [
    { id: 'tray', name: 'The instrument table', blurb: 'Steel under a cloth.', text: 'Hesketh keeps his instruments laid out in a row like cutlery for a very thorough dinner: scalpels, forceps, a bullet probe as long as your hand, curved needles stuck in a cork.',
      acts: function () { return [
        { id: 'probe', t: 'Palm the bullet probe', h: 'Thin steel that bends and stays bent.', show: function () { return !has('wire') && !S.f.probeTaken; }, v: 'pick', dc: 8,
          ok: { text: 'The probe slides up your cuff while Hesketh is leaning over the man who is not going to get better. Later, on your shelf, you bend the end of it against the stone into a little hook.', give: ['wire'], set: { probeTaken: true } },
          bad: { text: '“Put that back,” Hesketh says without turning round. You put it back. He counts his instruments, slowly and aloud, every time you are in the room after that.', fx: { watch: 1 } } }
      ]; } },

// ---------- the Assize ----------
var EVID_CK = {
  wirecopy: { t: 'Read the linesman’s report into the record', v: 'cipher', dc: 9, text: 'The river line and the fort wire, cut by hand with Signal Train nippers, at four and fifteen minutes past midnight. Fort Malice made deaf on purpose, the night before its route was ciphered. And the report of it filed under weather, by the office that copies everything on the Tanner line.', ok: 'Holloway asks who signs for the Tanner line’s traffic at the fort. Nobody answers. Then Crake says, quite quietly, “The Governor’s office,” and does not look at the clerk of the court, and that is worse for Pruett than if he had.', bad: '“A linesman’s pencil notes, carried by a chaplain,” says Crake. “The night of the sky-fire, when every wire in the valley went mad. The sky cut those lines, Major. Half the district saw it burn.”' },
  blotter: { t: 'Lay the blotter in front of Holloway', v: 'cipher', dc: 9, text: 'You hold the blotter up to the chapel window and show him the second hand pressed under your own: heavier, right-handed, tracing every group. You show him where the tracer’s pen slipped on the word FORD and dug through the paper.', ok: 'Holloway takes the blotter in both hands and holds it to the light for a long time. Then he holds up his own hand to the light, beside it, as if checking which way his pen would lean.', bad: 'Holloway looks at it. “A blotter,” he says. “Smudged. You might have done that yourself, in your cell, with a fingernail.”' },
  drafts: { t: 'Put Pruett’s practice sheets on the altar', v: 'cipher', dc: 8, text: 'Two hundred of your signatures, in cipher-room green, getting better down the page. And under them, the ferry company’s receipt for forty Crown tokens.', ok: 'Holloway turns the sheets over one at a time, all two hundred of them, while the whole chapel listens to paper. When he reaches the receipt he stops, and looks over his spectacles at the clerk of the court, who is Wexley Pruett.', bad: '“Forgeries of your hand,” says Crake. “By a man who has spent the week next door to a forger. Where did you get these, clerk?” Nobody can quite answer.' },
  chit: { t: 'Hold up the tin token', v: 'patter', dc: 9, text: 'A pewter Crown token, the Governor’s office tower on one face, W.P. scratched on the other, taken from a river-clan girl’s mouth in the reeds below Tanner’s Bridge.', ok: '“Paid for by the Crown,” you say, “through the Governor’s office, by the man who signs for the tokens.” You let the room work out who signs for the tokens. Several people turn, slowly, to look at the clerk of the court.', bad: '“A token,” says Crake. “Obtained from the very clan woman we suspect. How convenient that it accuses someone else.”' },
  bask: { t: 'Call Turnkey Bask', v: 'bowed', dc: 8, text: 'Bask stands in the aisle with his cap in his hands, sweating. You do not lead him. You only ask, gently, what he saw at one in the morning on the night the bell rang.', ok: 'Bask tells it plain: the lantern, the coat buttoned over something flat, the shilling. Then Chaplain Quill stands up without being asked and lays a brass button on the altar, from the tower stair.', bad: 'Bask looks at Crake, and at the Governor, and at his twenty-two years, and his voice fails. “It was dark, sir,” he says. “It might have been anybody.”' }

function assize() {
  if (S.over) return;
  startScreen();
  S.sneak = false;
  var h = '<div class="eyebrow">Day 4 · dawn</div><h2>The Assize</h2><div class="prose">' + paras('The bell rings six, very clearly. They come for you with the irons.\n\nThey have moved the altar. In its place is a trestle table with a green cloth and three chairs, and in the middle chair is Major Holloway: a grey, square, careful man with spectacles pushed up on his forehead and a stack of paper in front of him that he squares with both hands, now and then, as if it might escape. Crake stands to his left. To his right, at a little desk, the clerk of the court dips his pen. The clerk of the court is Wexley Pruett.\n\nThe chapel is full. The Row has been brought up to watch, in irons, because watching is supposed to be good for them. Ysolde is in the back row of the women. Chaplain Quill is by the vestry door, under the rope.\n\nHolloway reads the charge without looking up: that you did, being clerk of the cipher at Fort Malice, communicate the route of His Majesty’s retiring columns to the enemy, whereby three hundred men died at the Tanner ford.\n\n“Have you anything to put before the court?” he says. “In writing, preferably.”') + '</div>' +
    (LG() ? '<div class="prose">' + paras(lgDepositions()) + '</div>' : '') +
    voiceBlock([{ v: 'bell', text: 'I rang. You are here. Now speak.' }, { v: 'cipher', min: 2, text: 'In writing, preferably. Quill was right. He wants paper.' }, { v: 'casev', text: 'Put me on the table. I was there at the start of this.' }, { v: 'damp', text: 'You could say nothing. Nothing is very restful.' }]) +

var ENDINGS = {
  acquitted: { eyebrow: 'Acquitted', title: 'The clerk of the court', text: 'Holloway sets down the last piece of paper and squares the stack with both hands. Then he turns his head, slowly, and looks at the clerk of the court.\n\nWexley Pruett has stopped writing. His pen is still in his hand. There is green ink on his cuff. He says, quite pleasantly, “I think there has been a misunderstanding,” and then he stands up very fast and knocks the inkwell over, and two of Crake’s men have him before he reaches the vestry door, under the rope.\n\n“The prisoner is discharged,” Holloway says, and writes it down himself, since his clerk is indisposed. “Provost-Marshal. A word.”\n\nThey take the irons off in the aisle. Your wrists do not know what to do without them.' },
  commuted: { eyebrow: 'Commuted', title: 'The hulks', text: 'Holloway writes for a long time. When he looks up he says: “There is doubt. Not enough to discharge you. Too much to hang you. I will not hang a man I am not sure of.” He signs. “Transportation. The prison hulks at Oakhaven, for life, or until the Crown remembers you.”\n\nIt is not freedom. It is a tether, longer than the last one. But on the way out of the chapel, Wexley Pruett will not meet your eyes, and you understand that somebody, now, is going to start checking his column.' },
  hanged: { eyebrow: 'Hanged', title: 'Thursday', text: 'Holloway takes his spectacles down from his forehead and reads the sentence, and it is very short.\n\nThey do it at noon, in the yard, on the pine the carpenters built. The Row is brought out to watch, because watching is supposed to be good for them. Somebody in the men’s half starts the river lament, and somebody in the women’s half takes it up, and the turnkeys let them finish. Chaplain Quill writes in his register, in pencil, very small, what you said last.\n\nThe bell rings the hour. Twelve, very clearly.' },
  dead: { eyebrow: 'Dead', title: 'Cell Nine', text: 'You do not see the Assize. Malice gets you first: the cold, the wet, the blows, the hunger, in some order nobody bothers to write down. Bask finds you in the morning, on the shelf, with your face to the wall and your finger still in the last scratch.\n\nHesketh signs the certificate himself, in black ink, and underlines it.' },
  deadwall: { eyebrow: 'Dead', title: 'The foot of the tower', text: 'They find you in the morning at the foot of the bell tower, where the wall is lowest. The lamp is still turning. Somebody coils the rope and takes it back to the chapel, and the bell rings the hour, short, and then they splice it, and it rings properly again.' },
  escaped: { eyebrow: 'Escaped', title: 'The Tanner', text: 'You come out of the river on the far bank in the grey before dawn, half a mile below Malice, shaking so hard your teeth click. Behind you the bell begins to ring six. It rings on and on, past six, past twelve: the alarm. Let it.\n\nYou are not acquitted. You are not innocent, in any book the Crown keeps. You are a cipher clerk who sold the columns and broke out of the Royal Gaol, and there will be a price on you in every town on the postal trace. But the trace runs south through the valley, and the valley, you have heard, remembers who passed and how they behaved.' },
  riot: { eyebrow: 'Riot', title: 'Forty men and a gate', text: 'You say the word. Brannock says it louder. Forty men turn on the gate at once and the gate, which is made of boys, opens.\n\nIt is very fast and very loud and not all of it is anything you would want to remember. Turnkeys go down. Prisoners go down. Somebody has the keys to the women’s ward. Somebody has the postern. Then you are in the ditch, and then you are in the river, and the river does not care who you were.\n\nNineteen men and eleven women reach the far bank. Brannock is not one of them. He held the gate.' },
  riotfail: { eyebrow: 'Hanged', title: 'The ringleader', text: 'You say the word. Brannock says it louder. And the yard, which has been walking in a circle for a hundred years, does not quite believe it, and hesitates for one heartbeat, and in that heartbeat the gate shuts and the wall-walk fills with muskets.\n\nThey do not need an Assize for mutiny. Holloway signs the warrant at his breakfast. They hang you and Brannock together on Thursday, on the carpenters’ pine, and the Row is made to watch, and nobody sings.' },
  pardon: { eyebrow: 'The paper pardon', title: 'Exactly as written', text: 'You say it exactly as Crake wrote it, not a word more. You do not look at the back row of the women while you say it.\n\nHolloway writes. Crake nods. Wexley Pruett, at his little desk, copies it all down in a beautiful hand and blots it carefully. Your sentence is commuted to the hulks. Hers is not.\n\nThey hang Ysolde on Thursday. You watch from the Row, in irons, because watching is supposed to be good for you. She does not look at you either. There is a crow feather in her hair. The turnkeys have decided not to fight about it.' }
};

function feeling() {
  startScreen();
  var h = '<div class="eyebrow">Cell Nine</div><h2>How do you take it?</h2><div class="prose">' + paras('The door shuts. The key turns. The drip begins, and does not stop.\n\nYou served the Crown for four years in a room with no windows, turning its secrets into groups of five and back again. Now the Crown has put you in a smaller room with no windows. You are not sure yet what you feel.') + '</div><div class="choices">' +
    '<button class="choice" type="button" data-fe="0"><span class="t"><span class="n">1</span>Certain it is a mistake</span><span class="h">Crown +1. The Crown is a machine, and machines can be corrected. Stand straight.</span></button>' +
    '<button class="choice" type="button" data-fe="1"><span class="t"><span class="n">2</span>Certain it is a set-up</span><span class="h">Crown −1, Yard trust +1. Somebody chose you. The Row can smell that on you.</span></button>' +
    '<button class="choice" type="button" data-fe="2"><span class="t"><span class="n">3</span>Too tired to be certain of anything</span><span class="h">Stamina +1, Bread +1. You saved your supper. Small mercies.</span></button></div>';
  show(h);
  screen.querySelectorAll('[data-fe]').forEach(function (b) {
    b.onclick = function () {
      var i = +b.getAttribute('data-fe');
      S.bg = S.bgPick; delete S.bgPick;
      if (i === 0) { S.crown = 1; tally('loyal'); S.notice = voiceLine('writ', 'Good. They have made an error in the column. Errors can be corrected. That is what columns are for.'); }
      if (i === 1) { S.crown = -1; S.yard = 1; tally('defiant'); S.notice = voiceLine('ward', 'A set-up. Every man on this Row says that. Some of them are right.'); }
      if (i === 2) { S.st = 9; S.bread = 2; tally('meek'); S.notice = voiceLine('damp', 'Yes. Rest. There is nothing to be certain of down here except the water.'); }
      var lc = []; lgStart(lc); if (lc.length) S.notice = (S.notice || '') + lc.map(function (x) { return '<span class="chip info">' + esc(x) + '</span>'; }).join('');
      S.loc = 'cell'; showLoc();
    };
  });
}

title();
load3D();
})();
</script>
</body>
