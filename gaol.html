<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">

<title>The Postal Trace: Malice Gaol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Special+Elite&display=swap">
<style>
/* Same ledger-and-column layout as The Postal Trace, re-inked for stone: damp limestone ground, lamp-brass, wax-red, cold iron. */
:root {
  --bg: #121212; --panel: #1b1a18; --panel-2: #242220; --line: #36322d;
  --ink: #e2ddd2; --muted: #958d80; --tin: #b4b0a6; --wax: #b8352b; --brass: #cfa74b;

  --font-body: "Newsreader", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 19px; line-height: 1.6; min-height: 100vh; }
body.small { font-size: 17px; } body.large { font-size: 21px; }
#drip { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .55; }
.wrap { position: relative; max-width: 720px; margin-inline: auto; padding: 0 16px 64px; }
.ledger { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(18, 18, 18, .95); border-bottom: 1px solid var(--line); padding: 10px 16px; margin-inline: -16px; }
.ledger[hidden], .modal[hidden], .tip[hidden] { display: none !important; }
.vitals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 14px; }
.vital { min-width: 0; font-family: var(--font-head); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.vital .row { display: flex; justify-content: space-between; gap: 6px; }
.vital b { color: var(--ink); font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vital[data-tip] { cursor: help; }
.bar { height: 5px; background: var(--panel-2); margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--tin); transition: width .3s; }
.vital.hp .bar i { background: var(--bad); } .vital.st .bar i { background: var(--brass); } .vital.hr .bar i { background: var(--wax); } .vital.wt .bar i { background: #7fa3b8; }
.toolrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-family: var(--font-head); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.tool:hover, .tool:focus-visible { background: var(--panel-2); outline: none; }
.tool.pulse { background: var(--brass); color: #1a1405; }

.item.ev { border-color: var(--wax); color: #eaa59c; }
.item:hover, .item:focus-visible { border-color: var(--brass); outline: none; }
.eyebrow { margin-top: 30px; font-family: var(--font-head); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); }
h1, h2, h3 { font-family: var(--font-head); font-weight: 400; text-wrap: balance; margin: 6px 0 18px; line-height: 1.12; }
h1 { font-size: clamp(34px, 9vw, 54px); } h2 { font-size: clamp(25px, 6vw, 33px); } h3 { font-size: 20px; margin: 18px 0 8px; color: var(--brass); }
.prose p { margin: 0 0 1em; max-width: 65ch; }
.prose em { color: var(--tin); }
.prose.memory { border-left: 2px solid #8d8d8d; padding-left: 14px; color: #cbc6bb; font-style: italic; }
.prompt { font-family: var(--font-head); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { all: unset; display: block; cursor: pointer; background: var(--panel); border: 1px solid var(--line); padding: 13px 16px; min-width: 0; }
.choice:hover:not([disabled]), .choice.kb { border-color: var(--tin); background: var(--panel-2); }
.choice:focus-visible, .btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.choice[disabled] { opacity: .42; cursor: not-allowed; }
.choice .t { display: block; font-weight: 600; font-size: 18px; }
.choice .t .n { font-family: var(--font-head); font-weight: 400; color: var(--muted); font-size: 13px; margin-right: 8px; }
.choice .h { display: block; color: var(--muted); font-size: 16px; line-height: 1.45; margin-top: 2px; }
.choice .tags, .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-family: var(--font-head); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
.choice.voiceopt { border-left: 3px solid var(--brass); background: rgba(255,255,255,.025); }
.choice.voiceopt .t { font-style: italic; font-weight: 400; font-size: 17px; }
.choice.end { border-style: dashed; }
.tag { border: 1px solid var(--line); padding: 1px 7px; color: var(--tin); }
.tag.warn { color: var(--bad); border-color: var(--bad); } .tag.go { color: var(--good); border-color: var(--good); }
.tag.ck { cursor: help; text-decoration: underline dotted; text-underline-offset: 3px; }

.btn:hover { background: #cf4639; }

.btn.ghost:hover { background: var(--panel-2); }

.btn[disabled] { opacity: .35; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 22px; }
.actions.col { flex-direction: column; max-width: 320px; margin: 18px auto; }
.actions.col .btn { text-align: center; }
.roll { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; margin: 18px 0 8px; padding: 12px 16px; background: var(--panel); border: 1px solid var(--line); font-family: var(--font-head); font-size: 15px; }
.die { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--tin); font-size: 20px; }
.verdict { margin-left: auto; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; font-family: var(--font-head); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.chip { border: 1px solid var(--line); padding: 3px 9px; }
.chip.up { color: var(--good); border-color: var(--good); } .chip.down { color: var(--bad); border-color: var(--bad); } .chip.info { color: var(--brass); border-color: var(--brass); }
.fade { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
.voice { margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--line); background: var(--panel); font-size: 16px; }
.voice b { display: block; font-family: var(--font-head); font-weight: 400; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; cursor: help; }
.voice span { font-style: italic; }
.sk-hands { border-left-color: #b8352b !important; } .sk-hands b { color: #dd6d61; }
.sk-tongue { border-left-color: #cfa74b !important; } .sk-tongue b { color: #cfa74b; }
.sk-eyes { border-left-color: #7fa3b8 !important; } .sk-eyes b { color: #8fb6cc; }
.sk-bones { border-left-color: #6f9a5a !important; } .sk-bones b { color: #8bb871; }
.v-writ { border-left-color: #5b7bd5 !important; } .v-writ b { color: #93a9ee; }
.v-ward { border-left-color: #6d8c87 !important; } .v-ward b { color: #9bbab4; }
.v-case { border-left-color: #a08463 !important; } .v-case b { color: #c9a77f; }
.speaker { display: flex; gap: 14px; align-items: center; margin: 26px 0 12px; }
.speaker h2 { margin: 0; } .speaker .role { color: var(--muted); font-size: 16px; }
.port { width: 64px; height: 64px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel-2); font-family: var(--font-head); font-size: 26px; color: var(--ink); position: relative; overflow: hidden; }
.port::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 9px, rgba(0,0,0,.45) 9px 12px); }
.port.sm { width: 46px; height: 46px; font-size: 19px; }
.saying { border-left: 3px solid var(--brass); padding: 4px 0 4px 14px; margin: 0 0 12px; }
.saying .you { color: var(--muted); font-style: italic; margin-bottom: 6px; }
.saying p { margin: 0 0 .7em; }
.talkbar, .lookbar, .navbar { display: flex; flex-wrap: wrap; gap: 10px; }
.talkbtn, .lookbtn, .navbtn { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: center; flex: 1 1 200px; padding: 8px 10px; border: 1px solid var(--line); background: var(--panel); min-width: 0; }
.lookbtn { border-style: dashed; }
.talkbtn:hover, .lookbtn:hover, .navbtn:hover:not([disabled]), .talkbtn:focus-visible, .lookbtn:focus-visible, .navbtn:focus-visible, .kb { border-color: var(--brass) !important; outline: none; }
.talkbtn b, .lookbtn b, .navbtn b { display: block; font-weight: 600; font-size: 16px; }
.talkbtn i, .lookbtn i, .navbtn i { display: block; font-style: normal; color: var(--muted); font-size: 14px; line-height: 1.35; }
.lookbtn em, .talkbtn em { display: block; font-style: normal; color: var(--brass); font-size: 13px; }
.lookbtn.seen em { color: var(--muted); }
.navbtn[disabled] { opacity: .4; cursor: not-allowed; }
.navbtn .mk { width: 12px; height: 12px; flex: none; border: 2px solid var(--tin); }
.navbtn.here .mk { background: var(--wax); border-color: var(--wax); }
.clock { font-family: var(--font-head); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.notice { margin: 14px 0; padding: 8px 12px; border-left: 3px solid var(--wax); background: rgba(184,53,43,.08); font-size: 16px; }
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(8,8,8,.82); display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px; overflow: auto; }
.panel { width: 100%; max-width: 600px; background: var(--panel); border: 1px solid var(--line); padding: 20px; }
.hint { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
.tip { position: fixed; z-index: 40; max-width: 290px; background: var(--panel-2); border: 1px solid var(--tin); padding: 8px 10px; font-family: var(--font-body); font-size: 14px; line-height: 1.4; color: var(--ink); pointer-events: none; }
.tip em { color: var(--muted); }
.stats { display: grid; gap: 12px; margin: 14px 0 6px; }
.statrow { border: 1px solid var(--line); background: var(--panel-2); padding: 12px 14px; display: grid; gap: 6px; }
.shead { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; }
.shead b { font-family: var(--font-head); font-weight: 400; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
.stot { font-family: var(--font-head); font-size: 24px; color: var(--brass); }
.sdesc { color: var(--muted); font-size: 15px; }
.sparts { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--font-head); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
.sparts span { border: 1px solid var(--line); padding: 1px 7px; color: var(--tin); }
.sparts span.neg { color: var(--bad); border-color: var(--bad); }
.vlist { margin: 0; padding-left: 18px; font-size: 14px; color: var(--tin); display: grid; gap: 3px; }
.vlist b { font-family: var(--font-head); font-weight: 400; color: var(--ink); }
.xpline { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--font-head); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.holes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 10px 0; }
.hole { border: 2px solid var(--tin); background: rgba(0,0,0,.2); padding: 10px 12px; min-height: 90px; }
.hole.empty { border-style: dashed; display: flex; align-items: center; justify-content: center; text-align: center; opacity: .6; }
.hole.mulling { border-style: dotted; border-color: var(--brass); } .hole.done { border-color: var(--good); }
.hole b, .thoughtcard b { font-family: var(--font-head); font-weight: 400; letter-spacing: .05em; color: var(--brass); }
.hole p, .thoughtcard p { margin: 6px 0; font-size: 15px; }
.thoughtcard { margin: 10px 0; padding: 10px 14px; border: 1px solid var(--brass); background: var(--panel-2); }
.mullline { font-size: 13px; opacity: .8; margin: 6px 0; font-style: italic; }
.ccrow { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ccrow b { display: block; font-family: var(--font-head); font-weight: 400; }
.ccrow span { color: var(--muted); font-size: 14px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper .val { font-size: 20px; min-width: 26px; text-align: center; font-family: var(--font-head); color: var(--brass); }
.step { width: 38px; height: 38px; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); font-size: 20px; cursor: pointer; }
.step:disabled { opacity: .35; cursor: default; }
.archs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-bottom: 8px; }
.arch { text-align: left; background: var(--panel); color: var(--ink); border: 1px solid var(--line); padding: 10px 12px; cursor: pointer; font: inherit; }
.arch b { display: block; font-family: var(--font-head); font-weight: 400; } .arch span { display: block; color: var(--muted); font-size: 14px; }
.arch.sel { border-color: var(--brass); background: var(--panel-2); box-shadow: inset 3px 0 0 var(--brass); }
.after { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 14px; }
.after li { display: grid; gap: 2px; border-left: 2px solid var(--line); padding-left: 12px; max-width: 65ch; }
.after b { font-family: var(--font-head); font-weight: 400; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--brass); }
.after span { font-size: 17px; line-height: 1.5; }
.sumlist { margin: 20px 0 28px; padding: 0; list-style: none; display: grid; gap: 6px; font-family: var(--font-head); font-size: 14px; }
.sumlist li { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding-bottom: 6px; gap: 12px; }
.sumlist li span:last-child { color: var(--brass); text-align: right; }
.fstat { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 4px 0 12px; font-family: var(--font-head); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.fstat b { color: var(--ink); }
.fpips { display: inline-flex; gap: 3px; vertical-align: middle; } .fpips i { width: 11px; height: 11px; border: 1px solid var(--bad); } .fpips i.on { background: var(--bad); }
.flog { margin: 8px 0 14px; padding: 8px 12px; border-left: 3px solid var(--line); background: rgba(255,255,255,.025); }
.flog p { margin: 4px 0; }
.code { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line); padding: 8px; font: 12px monospace; resize: vertical; }
.setrow { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.setrow b { display: block; font-family: var(--font-head); font-weight: 400; } .setrow span { color: var(--muted); font-size: 14px; }
.seg { display: flex; flex: none; border: 1px solid var(--line); }

.titlescreen { text-align: center; padding: 40px 0 20px; }
.titlescreen .eyebrow { margin-top: 0; }
.credit { color: var(--muted); font-size: 13px; margin-top: 18px; }
.kbhint { color: var(--muted); font-size: 13px; font-family: var(--font-head); letter-spacing: .05em; }
@media (max-width: 460px) { .vitals { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px 8px; } .vital { font-size: 10.5px; } }

/* ---------- the 3D gaol (The Postal Trace's PSX renderer) ---------- */
#world { display: none; }
body.w3d #world { display: block; position: fixed; left: 0; top: 0; width: calc(100vw - 520px); height: 100vh; image-rendering: pixelated; outline: none; touch-action: none; z-index: 1; background: #050505; }
body.w3d .wrap { margin-left: calc(100vw - 520px); margin-right: 0; max-width: 520px; background: var(--bg); min-height: 100vh; border-left: 1px solid var(--line); }
body.w3d #drip { display: none; }
#wlabels { display: none; }
body.w3d #wlabels { display: block; position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
.wtag { position: fixed; left: 0; top: 0; font: 11px var(--font-head); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: rgba(10, 10, 10, .72); border: 1px solid var(--line); padding: 1px 6px; white-space: nowrap; }
.wtag.p { color: var(--brass); border-color: rgba(207, 167, 75, .6); }
.wtag.d { color: #9bbab4; border-color: #4a5d5a; }

.wtag.t { color: var(--tin); border-style: dashed; }
.wtag.hov { background: var(--brass); color: #1a1405; }

#wzoom button { width: 34px; height: 34px; background: rgba(18, 18, 18, .85); color: var(--brass); border: 1px solid var(--line); font: 16px var(--font-head); cursor: pointer; }
#whelp { display: none; }
body.w3d #whelp { display: block; position: fixed; left: 100px; bottom: 18px; z-index: 4; font: 11px var(--font-head); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
#wload { display: none; }
body.wloading #wload { display: block; position: fixed; left: 12px; bottom: 12px; z-index: 4; font: 11px var(--font-head); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 899px) {
  body.w3d #world { width: 100vw; height: 42vh; }
  body.w3d .wrap { margin-left: auto; margin-right: auto; max-width: 720px; padding-top: 42vh; border-left: 0; }
  body.w3d .ledger { top: 42vh; }

<body>
<canvas id="drip" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="ledger" id="ledger" hidden>
    <div class="vitals" id="vitals"></div>
    <div class="toolrow" id="toolrow"></div>
  </header>
  <main id="screen" aria-live="polite"></main>
</div>
<div class="modal" id="modal" hidden></div>
<div class="tip" id="tip" hidden></div>
<div id="whelp">Click to walk · click a person, a door or a thing · WASD · wheel to zoom</div>
<div id="wload">Loading the gaol in 3D…</div>
<script>
(function () {
'use strict';
// =====================================================================
//  THE POSTAL TRACE: MALICE GAOL — engine
//  Same bones as The Postal Trace: 2d6 + skill vs a difficulty, white
//  checks you can retry once you improve, red checks you get once, inner
//  voices that speak by skill, and a thought cabinet (here: Chalk Marks).
// =====================================================================

// ---------- dripping water (the rain, gone underground) ----------
var dc = document.getElementById('drip'), dx = dc.getContext('2d'), drops = [];
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeDrip() { dc.width = innerWidth; dc.height = innerHeight; }
sizeDrip(); addEventListener('resize', sizeDrip);
for (var i = 0; i < 26; i++) drops.push({ x: Math.random(), y: Math.random(), v: 0, wait: Math.random() * 300, l: 4 + Math.random() * 6 });
function drip() {
  dx.clearRect(0, 0, dc.width, dc.height);
  dx.strokeStyle = 'rgba(180,176,166,.32)'; dx.lineWidth = 1; dx.beginPath();
  for (var i = 0; i < drops.length; i++) {
    var d = drops[i], x = d.x * dc.width, y = d.y * dc.height;
    if (d.wait > 0) { d.wait -= 1; dx.moveTo(x, y); dx.lineTo(x, y + 1.5); continue; }
    dx.moveTo(x, y); dx.lineTo(x, y + d.l);
    d.v += 0.0006; d.y += d.v;
    if (d.y > 1) { d.y = Math.random() * 0.15; d.x = Math.random(); d.v = 0; d.wait = 120 + Math.random() * 400; }
  }
  dx.stroke();
  if (!reduce) requestAnimationFrame(drip);
}
drip();

// ---------- helpers ----------
var screen = document.getElementById('screen');
function $(id) { return document.getElementById(id); }

// ---------- effects ----------
function applyFx(fx, chips) {
  chips = chips || [];
  ['hp', 'st', 'bread', 'hrs', 'watch', 'tob', 'yard', 'crown'].forEach(function (k) {
    if (!fx || !fx[k]) return;
    if (k === 'hrs') { passTime(fx[k], chips); return; }
    var before = S[k]; S[k] += fx[k]; clamp(k);
    var diff = S[k] - before;
    if (diff) {
      var bad = k === 'watch' ? diff > 0 : diff < 0;
      chips.push('<span class="chip ' + (bad ? 'down' : 'up') + '">' + NAMES[k] + ' ' + signed(diff) + '</span>');
      if (k === 'crown' && S.crown >= 2) newThought('kingspeace', chips);
    }
  });
  return chips;
}
function addXp(n, chips) {
  if (!n) return;
  S.xp += n;
  while (S.xp >= S.level * 40) { S.level += 1; S.points += 1; if (chips) chips.push('<span class="chip info">Level ' + S.level + ': a skill point to spend</span>'); }
}
function tally(t) { if (t && S.tally[t] !== undefined) S.tally[t] += 1; }
function passTime(h, chips) {
  chips = chips || [];
  if (h <= 0) return chips;
  S.hrs += h;
  chips.push('<span class="chip down">' + h + ' hour' + (h > 1 ? 's' : '') + '</span>');
  // thoughts sink in by the hour
  var done = [];
  Object.keys(S.mull).forEach(function (tid) { if (S.mull[tid] > 0) { S.mull[tid] -= h; if (S.mull[tid] <= 0) { delete S.mull[tid]; done.push(tid); } } });
  done.forEach(function (tid) { chips.push('<span class="chip info">A chalk mark has sunk in: ' + esc(THOUGHTS[tid].name) + '</span>'); S.pendingSunk = (S.pendingSunk || []).concat([tid]); });
  // hunger: every twelve hours you eat a crust if you have one
  S.hunger += h;
  while (S.hunger >= 12) {
    S.hunger -= 12;
    if (S.bread > 0) { S.bread -= 1; chips.push('<span class="chip down">Ate a crust · Bread −1</span>'); }
    else { var b = S.st; S.st = Math.max(0, S.st - 2); chips.push('<span class="chip down">Hungry · Stamina ' + signed(S.st - b) + '</span>'); if (b === 0) { S.hp = Math.max(0, S.hp - 1); chips.push('<span class="chip down">Starving · Health −1</span>'); } }
  }
  // staying awake costs a little
  if (h >= 2 && !S.sleeping) { var s0 = S.st; S.st = Math.max(0, S.st - Math.floor(h / 4)); if (S.st < s0) chips.push('<span class="chip down">Stamina ' + signed(S.st - s0) + '</span>'); }
  return chips;
}
function outcomeFx(o, chips) {
  if (!o) return chips;
  if (o.fx) applyFx(o.fx, chips);
  (o.give || []).forEach(function (g) { give(g, chips); });
  (o.take || []).forEach(function (g) { take(g, chips); });
  if (o.set) Object.keys(o.set).forEach(function (k) { S.f[k] = o.set[k]; });
  if (o.thought) newThought(o.thought, chips);
  if (o.tally) tally(o.tally);
  addXp(o.xp || 0, chips);
  if (o.run) o.run(chips);
  return chips;
}

}

          ok: { text: 'His head goes down on his chest. The ring lies on his knee, the long key towards you. You fold the soft wax round its bit and count to ten, and lift it away clean. A perfect print, in a curl of tallow, in your armpit.', give: ['impress'], take: ['wax'], set: { printTried: true }, to: 'hub' },
          bad: { text: 'The ring chimes. Bask’s eyes open on your hand, the wax, the key. For a long moment he says nothing. Then he takes the wax, drops it in his lantern, and watches it burn. “I’ll be writing that down,” he says, and does not move away from the bars again all night.', take: ['wax'], fx: { watch: 2 }, set: { printTried: true }, to: '<' } },
        { q: '“How does the night go? When do you walk the yard?”', show: function () { return S.f.baskDrunk && !S.f.rota; }, to: 'rota', set: { rota: true } },
        { q: 'Let him walk on.', to: '<' }
      ] },
    drinks: { say: 'Bask goes very still. “Who’d believe you,” he says at last. It is not a question. But he does not look at you like a dog any more. He looks at you like a man who knows something.', opts: [{ q: 'Go on.', to: 'hub' }] },
    drunk: { say: 'He looks at the bottle, and at you, and at the dark of the Row both ways. Then he uncorks it with his teeth. “Oakhaven gin,” he says reverently. “My mother’s town.” He sits down on the flags with his back to your bars. After a while he starts to talk about his mother.', voices: [{ v: 'patter', text: 'A man who sits down has decided to stay. Ask him things.' }], opts: [{ q: 'Go on.', to: 'hub' }] },
    bell: { say: 'Bask’s hand goes to his collar, where something hangs on a string. “I heard it. Everyone on the night watch heard it. Two strokes, at one in the morning, and no hand on the rope.” He lowers his voice. “Chaplain says it was the wind. I went up to look. Rope was swinging.”', voices: [{ v: 'cipher', text: 'Somebody went up the tower stairs at one in the morning, and caught the rope on his way past. Somebody who was not supposed to be on the stairs.' }],
      opts: [{ q: 'Go on.', to: 'hub' }] },
    saw: { say: 'He drinks, or he does not, depending; either way he tells you. “It was a lantern in the cipher room. One in the morning. I thought it was you working late, and I thought, good lad. Then I come round the stair and it’s Mr. Pruett coming out, with his coat buttoned over something flat.” He frowns into the dark. “He gave me a shilling and said the Governor had sent him. The Governor was at Oakhaven that night. I knew it. I took the shilling.”',
      voices: [{ v: 'tally', text: 'One in the morning. The bell rang at one in the morning. He caught the rope on the tower stair, going up to the Governor’s rooms with your route under his coat.' }, { v: 'writ', min: 1, text: 'A sworn witness. Holloway will have to hear a turnkey of the Crown.' }],
      opts: [{ q: 'Go on.', to: 'hub' }] },
    swear: { say: '“Swear it? Against the Governor’s own secretary?” Bask laughs, but there is nothing in it. “I’ve a pension coming. Twenty-two years.”',
      opts: [
        { q: 'The Commission: “You are a servant of the Crown, Mr. Bask. So was I. This is what the Crown is for.”', vo: 'writ', show: function () { return S.crown >= 1; }, to: 'sworn', give: ['bask'], tally: 'loyal' },
        { q: '“And if they learn you drink on watch and took a shilling to see nothing? There goes the pension anyway.”', show: function () { return S.f.baskDrinks; }, v: 'patter', dc: 8, tally: 'cunning',
          ok: { text: 'His face closes like a door. “You’d do that.” A long breath. “Then I’ll say it. And then I’ll never speak to you again.”', give: ['bask'], to: 'hub' }, bad: { text: '“Try it,” he says. “Your word against twenty-two years.” He walks away.', set: { baskRefused: true }, to: '<' } },
        { q: 'Bowed Head: “Please. I have three days. You have twenty-two years. Lend me some of them.”', v: 'bowed', dc: function () { return S.f.baskDrunk ? 8 : 10; }, red: true, tally: 'meek',
          ok: { text: 'He is quiet so long you think he has fallen asleep. “My nephew,” he says. “He would have been at the ford, you know. If the route had been a day different.” He wipes his face. “I’ll say it.”', give: ['bask'], to: 'hub' }, bad: { text: 'He shakes his head slowly and takes up his lantern. “I’m sorry, lad. I am.”', set: { baskRefused: true }, to: '<' } },
        { q: '“Never mind.”', to: 'hub' }
      ] },
    sworn: { say: 'Bask straightens as though somebody has called the roll. “Yes,” he says. “Yes, it is.” He touches his cap to you. Nobody has touched a cap to you in a long time.', opts: [{ q: 'Go on.', to: 'hub' }] },
    rota: { say: 'Bask tells you the night as if it were a recipe. The lamp on the bell tower sweeps the yard every quarter-hour. He walks the Row on the half and the hour. Corporal Mott walks the wall at two and four. Between the half and the hour, with the lamp past the tower angle, a man could cross the yard and only the rats would see him. “Not that anyone would,” he adds, and drinks.',
      voices: [{ v: 'tally', text: 'Quarter-hour lamp. Half and hour for Bask. Two and four for Mott. A gap of eleven minutes, twice a night. Write it on the inside of your skull.' }], opts: [{ q: 'Go on.', to: 'hub' }] }
  } };

NPC.ysolde = { name: 'Ysolde', mono: 'Y', hue: 140, role: 'River-clan. The women’s ward, through the grate.',
  start: function () { return S.seen.talk_ysolde ? 'hub' : 'start'; },
  nodes: {
    start: { say: 'On the far side of the iron grate that splits the yard, in the women’s half, a young woman sits on her heels with her back to the wall. Her hair is cut short as a boy’s and there is a crow feather in it, which the turnkeys have either not noticed or decided not to fight about.\n\nShe watches you cross the yard. She watches the way a heron watches a ford.',
      voices: [{ v: 'drain', min: 2, text: 'She does not blink when the turnkey at the gate raps his staff. She is listening for something else.' }, { v: 'ward', text: 'River-clan. Brought in the morning after the ford. The Row says she is the one who sold the route on to the rebels. The Row says that about you too.' }],
      opts: [{ q: 'Go to the grate. “They say you were at the ford.”', to: 'ford' }, { q: 'Nod to her, and leave her be.', to: '<', fx: { yard: 0 } }] },
    ford: { say: '“They say you wrote the route,” she says. Her accent turns the Crown’s words over like stones in a stream. “They caught me in the reeds below Tanner’s Bridge the morning after. I had a tin token in my mouth, for passage south. The provost took it and gave me a cell and a story.” She tilts her head. “What story did they give you?”',
      opts: [{ q: '“That I sold the route.”', to: 'hub', set: { ysoldeMet: true } }, { q: 'Cipher: “A tin token. Stamped with what?”', vo: 'cipher', to: 'token', set: { ysoldeMet: true } }] },
    token: { say: '“A mark like a little tower. And letters scratched by a thumbnail.” She draws them on the grate in the air: W, P. “The man who gave the tokens to my uncle wore gloves and a cloak, and spoke like a priest. He paid for the route in Crown tokens so the rebels could cross at Willow Steps on the Crown’s own ferry.” She shrugs. “The provost has it now. Or he has the one I gave him. I kept the other.”',
      voices: [{ v: 'tally', text: 'The Governor’s office mark is a little tower. W. P. Wexley Pruett.' }, { v: 'cipher', min: 3, text: 'He paid in Crown tokens because he had them. He had them because he signs for them.' }],
      opts: [{ q: 'Go on.', to: 'hub', set: { knowToken: true } }] },
    hub: { say: function () { return S.f.ysoldeFriend ? 'Ysolde is waiting at the grate before you reach it. She does not smile, but she lifts her chin, which from her is the same thing.' : 'Ysolde watches you from her side of the grate.'; },
      opts: [
        { q: '“Did you watch the postal trace, before the ford?”', show: function () { return !S.f.ysoldeCourier; }, to: 'courier', set: { ysoldeCourier: true } },
        { q: '“The token. The one you kept. Give it to me and I can hang the man who paid for the ford.”', show: function () { return S.f.knowToken && !has('chit') && !S.f.chitGone; }, to: 'ask' },
        { q: 'Pass the laudanum through the grate. “For your friend with the fever.”', show: function () { return has('laudanum') && !S.f.ysoldeFriend && S.f.knowMaud; }, to: 'maud', take: ['laudanum'], set: { ysoldeFriend: true }, fx: { yard: 1 }, tally: 'loyal' },
        { q: '“Do you have a pin, or a bit of wire? Anything stiff.”', show: function () { return S.f.ysoldeFriend && !has('wire') && !S.f.pinGiven; }, to: 'pin', give: ['wire'], set: { pinGiven: true } },
        { q: '“I am going over the wall. Come with me.”', show: function () { return S.f.ysoldeFriend && !S.f.ysoldeComes && (has('rope') || has('key') || has('impress')); }, to: 'come' },
        { q: 'Leave the grate.', to: '<' }
      ] },
    courier: { say: function () { return ysoldeCourier(); }, say0: '“We watch everyone on the trace.” Something moves behind her face. “A week before the ford, a gunner came down it. One bad shoulder, a limp, a tin case on a strap. Pell’s people followed him from the creek. He never shot at us. He shared bread with a deserter at the Cross-Pillars. We let him walk.” She looks at you. “He was carrying your route, wasn’t he? In that tin case.”',
      enter: function () { var c = []; newThought('crow', c); S.notice = c.join(' '); },
      voices: [{ v: 'casev', text: 'He carried me through the rain and did not open me until he had to. I would like it known that the route left me sealed.' }, { v: 'bell', text: 'Four copies. Four stamps. And then a clerk in a room at the bottom of the trace, with a pencil, writing it plain.' }],
      opts: [{ q: 'Go on.', to: 'hub' }] },
    ask: { say: function () { return S.yard >= 1 || S.f.ysoldeFriend ? '“The Row says you share your bread,” she says. She reaches into her hair, behind the feather, and brings out a disc of grey pewter on a thread. “Hang him high. My uncle drowned at Willow Steps when the ferry turned over.”' : '“Why would I give a Crown clerk the only thing I own?” Somewhere on her side of the grate a woman is coughing, wet and bad. Ysolde’s eyes go to the sound and come back. “Maud’s fever is worse. The surgeon’s mate will not cross to our side.”'; },
      enter: function () { S.f.knowMaud = true; },
      opts: [
        { q: 'Take the token.', show: function () { return S.yard >= 1 || S.f.ysoldeFriend; }, to: 'hub', give: ['chit'], tally: 'loyal' },
        { q: 'The Gallows Choir: sing her the river lament the condemned sing on the Row.', show: function () { return !(S.yard >= 1 || S.f.ysoldeFriend); }, v: 'choir', dc: 9, red: true,
          ok: { text: 'You do not know the words. The Choir does, in eleven voices, and you let them use your mouth. On the women’s side of the grate the coughing stops to listen. When it is over Ysolde puts the token in your hand without saying anything at all.', give: ['chit'], fx: { yard: 1 }, to: 'hub' },
          bad: { text: 'Your voice cracks on the second line. A turnkey bangs the grate with his staff and tells you to save it for the scaffold. Ysolde has turned her back.', fx: { watch: 1 }, to: '<' } },
        { q: '“I’ll get medicine for Maud.”', to: 'hub', show: function () { return !(S.yard >= 1 || S.f.ysoldeFriend); } }
      ] },
    maud: { say: 'Ysolde takes the bottle, and looks at it, and at you. “Crown clerk,” she says, as if trying the words out to see if they still mean what they meant. Then she is gone into the dark of the women’s ward. When she comes back her hands are empty and her face is wet. “Maud is sleeping.”',
      voices: [{ v: 'ward', text: 'The whole Row will know by supper. The women’s ward knew before you had finished the sentence.' }], opts: [{ q: 'Go on.', to: 'hub' }] },
    pin: { say: 'She pulls a long pin of yellowed bone from the hem of her skirt and bends it twice against the grate before she hands it through. “River-clan locks are cleverer than yours,” she says. “You’ll manage.”', opts: [{ q: 'Go on.', to: 'hub' }] },
    come: { say: '“Over the wall.” She weighs it. “The river side is mine. Get me across the yard at night and I will get us both across the Tanner. The women’s ward door is the same lock as yours. Bask never checks it.”',
      opts: [{ q: '“Then be ready.”', to: 'hub', set: { ysoldeComes: true } }, { q: '“Not yet.”', to: 'hub' }] }
  } };

NPC.brannock = { name: 'Brannock', mono: 'BR', hue: 330, role: function () { return S.f.brannockAlly ? 'Yard boss. Your ally, for what it is worth.' : 'Yard boss. Deserter, late of Vane’s crew.'; },
  start: function () { return S.seen.talk_brannock ? 'hub' : 'start'; },
  nodes: {
    start: { say: 'The biggest man in the yard is sitting on the only bench, which nobody else is sitting on. He has a sergeant’s chevrons cut out of his sleeve and the pale shapes of them left behind. Four men stand near him and pretend not to.\n\n“Cipher clerk,” says Brannock. “Every new fish pays the bench. Two twists or a loaf. It keeps the yard friendly.”',
      voices: [{ v: 'knuckles', text: 'Big. Slow on the left: an old break in that wrist. He knows you know.' }, { v: 'ward', text: 'The yard pays because the yard always has. Paying is not shame here. Refusing is a speech.' }, { v: 'tally', min: 3, text: 'Four men near him. Two of them are watching the gate, not you. He is not as safe on that bench as he looks.' }],
      enter: function () { S.f.metBrannock = true; },
      opts: [
        { q: 'Pay two twists of tobacco.', need: function () { return S.tob >= 2; }, why: 'You have fewer than two.', to: 'paid', fx: { tob: -2, yard: 1 }, set: { brannockPaid: true }, tally: 'meek' },
        { q: 'Pay a loaf.', need: function () { return S.bread >= 1; }, why: 'You have no bread.', to: 'paid', fx: { bread: -1, yard: 1 }, set: { brannockPaid: true }, tally: 'meek' },
        { q: '“The bench can go hungry.”', to: 'refuse', set: { brannockGrudge: true }, tally: 'defiant' },
        { q: 'Patter: “I can pay you better than tobacco. I can read, and you have letters you can’t.”', v: 'patter', dc: 9, tally: 'cunning',
          ok: { text: 'Brannock’s eyes narrow, then something like interest. He takes a folded square of paper from inside his shirt, soft as cloth from handling. “From my sister. Read it.” You read it. It is not good news, and you read it gently. When you are done he folds it away. “Bench is paid,” he says.', fx: { yard: 1 }, set: { brannockPaid: true }, to: 'hub' },
          bad: { text: '“I can read fine,” Brannock says, and two of his men laugh. “Tomorrow, then. You and me.”', set: { brannockGrudge: true }, to: '<' } }
      ] },
    paid: { say: 'Brannock pockets it without looking. “Friendly yard,” he says.', opts: [{ q: 'Go on.', to: 'hub' }] },
    refuse: { say: 'The yard goes quiet in a ring around you. Brannock looks at you for a long moment, then smiles. “Not today. Tomorrow. Let you think about it.” He turns back to the sun.', voices: [{ v: 'damp', text: 'You could still lie down on the flags. People forgive a man lying down.' }], opts: [{ q: 'Walk away.', to: '<' }] },
    hub: { say: function () { return S.f.brannockAlly ? 'Brannock moves over on the bench. It is the most expensive seat in Malice, and he does it for you.' : 'Brannock is on his bench, eyes half closed.'; },
      opts: [
        { q: '“You were at Tanner’s Bridge, with Vane.”', show: function () { return !S.f.brannockVane; }, to: 'vane', set: { brannockVane: true } },
        { q: '“You can get things. I need a bottle.”', show: function () { return S.f.brannockAlly && !S.f.brannockGin; }, to: 'gin', give: ['gin'], set: { brannockGin: true } },
        { q: '“What would the yard do, if somebody gave it the word?”', show: function () { return S.f.brannockAlly; }, to: 'riot' },
        { q: 'Leave him to the sun.', to: '<' }
      ] },
    vane: { say: function () { return vaneStory(); }, say0: '“Held it six days. Vane said we were the new toll on the old road.” He spits. “Then a courier came down the trace with a tin case and a face like a wet Sunday and told Vane there was a Crown wagon train on the north road. Gold for the garrison. Vane took the whole crew north to find it.” He laughs, a real laugh, surprised out of him. “There was no wagon train. Provost’s men were waiting where it should have been. That is how I come to be on this bench.”',
      voices: [{ v: 'casev', text: 'A good bluff. He was very frightened. He did it anyway.' }, { v: 'patter', text: 'He is not angry. He admires it. Men like Brannock love being beaten properly.' }],
      opts: [{ q: 'Go on.', to: 'hub' }] },
    gin: { say: 'Half a bottle appears from somewhere under the bench. “Oakhaven,” Brannock says. “Bask’s weakness. Everyone’s.”', opts: [{ q: 'Go on.', to: 'hub' }] },
    riot: { say: function () { return S.yard >= 2 ? '“The yard would go,” Brannock says, low. “Forty men. The gate turnkeys are boys. We would lose some. Some of us would be in the river by dark.” He looks at you. “You give the word, cipher clerk. In the yard, in daylight. And then you run with the rest of us.”' : '“The yard?” He snorts. “The yard does not trust you yet. It would sit on its hands and watch you hang. Give them a reason. Bread. A kindness. Something they can talk about.”'; },
      voices: [{ v: 'writ', min: 0, text: 'Mutiny. Forty men. Some of the turnkeys are boys, he says. This is the end of you as anything the Crown could ever pardon.' }, { v: 'knuckles', text: 'Forty men and a gate made of boys. Do the arithmetic. It is very simple arithmetic.' }],
      opts: [{ q: 'Go on.', to: 'hub' }] }
  } };

NPC.quill = { name: 'Chaplain Quill', mono: 'AQ', hue: 60, role: 'Ambrose Quill, chaplain to the gaol.',
  start: function () { return S.seen.talk_quill ? 'hub' : 'start'; },
  nodes: {
    start: { say: 'A thin, untidy man in a cassock gone green at the seams is changing candles at the little altar, pinching each wick before he pulls it. He looks round at you with a kind of tired attention.\n\n“The cipher clerk. I am to see you before the Assize, for your soul. It is in the regulations.” He pinches another wick. “I would rather see you for your sake. Sit, if you like.”',
      voices: [{ v: 'bowed', text: 'A churchman. Let him be kind to you. Kindness is a lever, and he has offered you the handle.' }, { v: 'choir', text: 'He buried all of us. He did it properly. He learned our names.' }],
      opts: [{ q: 'Sit.', to: 'hub', fx: { st: 1 } }] },
    hub: { say: 'Quill sits beside you on the bench with his hands between his knees.',
      opts: [
        { q: '“Tell me about Major Holloway.”', to: 'holloway', show: function () { return !S.f.knowHolloway; }, set: { knowHolloway: true } },
        { q: 'Bowed Head: “Could I have some candle-ends, Father? The nights are very dark.”', show: function () { return !has('wax') && !has('impress') && !has('key'); }, v: 'bowed', dc: 7, ok: { text: 'He fills your hands with stubs of tallow and a broken curl of beeswax. “Keep them away from the straw.”', give: ['wax'], to: 'hub' }, bad: { text: '“Candles are counted,” he says apologetically. “By the Governor’s secretary. Every one.”', to: 'hub' } },
        { q: '“Could you put me on the scrubbing detail? The Governor’s floors.”', show: function () { return !S.f.detail; }, to: 'detail' },
        { q: '“Hear my confession, Father.”', show: function () { return !S.f.confessed; }, to: 'confess', set: { confessed: true } },
        { q: '“The bell rang by itself, the night before the ford.”', show: function () { return S.f.baskBell && !S.f.quillBell; }, to: 'bell', set: { quillBell: true } },
        { q: '“The courier who brought the case. Did he bring anything else?”', show: function () { var L = LG(); return !!(L && (L.letters || (L.clues && L.clues.copy)) && ['depot', 'truth', 'late'].indexOf(L.ending) >= 0) && !S.f.quillCourier; }, to: 'courier', set: { quillCourier: true } },
        { q: 'Thank him, and go.', to: '<' }
      ] },
    holloway: { say: '“Major Holloway has sat eleven Assizes this season and hanged eleven men.” He says it carefully, so that it is only a fact. “He is not cruel. He is literal. He does not trust what men say, because men say anything to a rope. He trusts what is written. A man with a written thing in his hand, Holloway will hear. Give him paper, clerk.”',
      voices: [{ v: 'cipher', text: 'Paper. You have spent your life on paper. Good.' }, { v: 'tally', text: 'Eleven of eleven. A column with no errors in it is a column nobody has checked.' }], opts: [{ q: 'Go on.', to: 'hub' }] },
    detail: { say: function () { return S.crown >= 1 ? '“You have behaved very properly. I can ask.” He writes a note on the flyleaf of his prayer book and tears it out. “Ten until noon, any morning. Mr. Pruett will find you a bucket.”' : '“The Governor’s rooms are for trusted men.” He looks at you, considering. “Are you a trusted man?”'; },
      enter: function () { if (S.crown >= 1) S.f.detail = true; },
      opts: [
        { q: 'Bowed Head: “I was the Crown’s clerk for four years, Father. I would like to be useful.”', show: function () { return !S.f.detail; }, v: 'bowed', dc: 8, ok: { text: '“Yes,” he says slowly. “Yes, I believe you would.” He writes the note. “Ten until noon, any morning.”', set: { detail: true }, fx: { crown: 1 }, to: 'hub' }, bad: { text: '“Perhaps after the Assize,” he says, and then hears what he has said, and looks away.', to: 'hub' } },
        { q: 'Go on.', to: 'hub' }
      ] },
    confess: { say: 'He takes a purple stole from his pocket and kisses it and puts it on. “Go on.”',
      opts: [
        { q: 'Tell him the truth: the plaintext, the blotter, the secretary on the stairs.', to: 'truth', fx: { crown: 1 }, tally: 'meek' },
        { q: 'Patter: confess to small sins and watch where his eyes go.', v: 'patter', dc: 8, tally: 'cunning', ok: { text: 'Envy, sloth, a stolen apple at nine years old. His eyes drift, as you talk, to the vestry door, where the bell rope hangs in its loop. He is thinking about the bell. Everyone in Malice is thinking about the bell.', to: 'hub' }, bad: { text: 'He listens to your apple with great patience and absolves you of it. You feel, absurdly, better.', fx: { st: 1 }, to: 'hub' } }
      ] },
    truth: { say: 'He is quiet a long time. “I have heard a great many confessions from men in your cell,” he says. “Most of them confessed to something. You have confessed to somebody else.” He takes off the stole and folds it. “I cannot carry what is said under the seal into a court. But I can pray for you in front of Major Holloway, and he will notice who I pray for.”',
      voices: [{ v: 'writ', text: 'A chaplain of the Crown, on your side. Stand straighter.' }], opts: [{ q: 'Go on.', to: 'hub' }] },
    courier: { say: function () { var L = LG(), t = []; if (L.letters) t.push('“Letters,” Quill says. “A bundle of them, tied with a bootlace, out of the coats of the dead of the Third Battery. He put them in my hands at the gate as if they were the real dispatch. And you, clerk, you franked every one of them in the cipher room that night, and wrote the families’ directions on the backs in your own hand, on your own time. I have the bundle. I saw the hand.”'); if (L.clues && L.clues.copy) t.push('“And this.” He takes a folded sheet from inside his cassock: pencil, a linesman’s figures, an address on the back in a hand very like his own. “My brother Tobias keeps the hut at Hob’s Cutting. He sent it by the courier, by hand, because his report up the wire was filed under weather.”'); return t.join('\n\n'); },
      voices: [{ v: 'cipher', text: 'Your hand on the backs of eleven letters, on the night you are supposed to have sold three hundred men. A traitor does not frank the dead men’s post.' }, { v: 'choir', show: function () { var L = LG(); return !!(L && L.storm && L.storm.heard); }, text: 'The night the sky burned, somebody called up the dead line, and somebody answered. Nine, it said. We heard it too. We hear everything that comes down a wire.' }],
      opts: [
        { q: '“Would you lay the letters before Holloway?”', show: function () { var L = LG(); return !!(L && L.letters) && !S.f.lettersSworn; }, to: 'courier', set: { lettersSworn: true }, fx: { crown: 1 }, h: 'Evidence of character. Holloway likes paper.' },
        { q: 'Take the linesman’s report.', show: function () { var L = LG(); return !!(L && L.clues && L.clues.copy) && !has('wirecopy'); }, to: 'courier', give: ['wirecopy'] },
        { q: 'Go on.', to: 'hub' }
      ] },
    bell: { say: '“The wind,” Quill says at once, too quickly. Then: “No. Somebody was on the tower stair. I found a button on the third step in the morning. Brass. A clerk’s coat button, with the little tower of the Governor’s office on it.” He opens his hand. The button is there, warm from his palm. He has been carrying it for a week. “I did not know who to give it to.”',
      voices: [{ v: 'cipher', min: 2, text: 'Every clerk on the Governor’s staff has those buttons. Including one with a coat buttoned over something flat.' }],
      opts: [{ q: '“Give it to Major Holloway. At the Assize.”', to: 'hub', set: { quillButton: true }, fx: { crown: 1 } }] }
  } };

NPC.hesketh = { name: 'Hesketh', mono: 'H', hue: 260, role: 'Surgeon’s mate. Bloody apron, steady hands.',
  start: function () { return S.seen.talk_hesketh ? 'hub' : 'start'; },
  nodes: {
    start: { say: 'The infirmary is a long vault with six cots, four of them occupied, and a brazier that makes it the only warm room in Malice. A young man with a bloody apron and a pencil behind his ear is sewing a cut in a turnkey’s hand. He glances up.\n\n“If you are bleeding, sit. If you are not, do not waste my time pretending to be.”',
      voices: [{ v: 'gall', text: 'Warm. Let the wrists stop shouting for a minute.' }],
      opts: [{ q: 'Sit.', to: 'hub' }] },

NPC.comrade = { get name() { var c = lgComrade(); return c ? c.name : ''; }, get mono() { var c = lgComrade(); return c ? c.mono : ''; }, get hue() { var c = lgComrade(); return c ? c.hue : 0; }, role: function () { var c = lgComrade(); return c ? c.role : ''; },

NPC.crake = { name: 'Provost-Marshal Crake', mono: 'RC', hue: 0, role: 'Ruthven Crake, provost-marshal of the Malice district.',
  start: 'start',
  nodes: {
    start: { say: 'The door of Cell Nine opens at an hour when doors do not open, and a tall man in a provost’s black coat ducks under the lintel. He brings his own stool. A turnkey sets it down for him and leaves.\n\nProvost-Marshal Crake sits, crosses his legs, and looks at you for some time.\n\n“You will hang on Thursday,” he says. “I have no doubt of it, and nor has Major Holloway. But I would rather hang the right number of people, and I think the number is two. You had help on the river side. The clan girl in the women’s ward. Say she was your contact, under oath, and I will see that your sentence is commuted. The hulks, not the rope. Twenty years, and alive at the end of it.”',

      opts: [

        { q: '“No. She didn’t do it, and neither did I.”', to: 'no', fx: { yard: 1, crown: -1 }, tally: 'defiant' },
        { q: 'Patter: “Let me think about it. What is in the evidence chest, exactly?”', v: 'patter', dc: 9, tally: 'cunning',
          ok: { text: '“The cipher-room key. Your blotter. A dispatch case the courier left, which I confess I added for colour.” Crake smiles very slightly. “Holloway likes a physical object. Think about it. You have until Thursday.”', set: { knowChest: true }, to: 'end' },
          bad: { text: '“Do not trade with me, clerk. I am not a market.” He stands.', to: 'end' } }
      ] },
    deal: { say: '“Good.” Crake stands. “Say it in the court exactly as I will write it for you. Not a word more.” He ducks under the lintel and is gone. Out on the Row, someone has been listening at the bars, and the news goes away down the cells like water down a drain.', opts: [{ q: 'Go on.', to: '<' }] },
    no: { say: 'Crake looks at you with something that is nearly respect and nearly pity. “A pity,” he says. “You would have been tidier alive.” He stands, takes his stool, and goes.', voices: [{ v: 'ward', text: 'The Row heard that too.' }], opts: [{ q: 'Go on.', to: '<' }] },

// ---------- places ----------
function open(a, b) { return function () { var h = hourOfDay(); return h >= a && h < b; }; }
var DAY_ROUTE = ['cell', 'yard', 'chapel', 'kitchen', 'infirmary', 'records'];
var NIGHT_ROUTE = ['cell', 'records', 'wall'];
// ---------- living dice: Jory Lamb's ring on the yard step (only with living dice on) ----------
var LD_HANG_NOTE = 'Cut, Jory swears, from the knucklebone of a hanged man. Every face starts at six or better and it always runs hot toward its best face. But each throw, the face across from the one that lands loses 2, not 1. Lean on it long enough and every face goes below zero.';
function ldHangDie() { return ldDie('The Hangman’s Die', [6, 7, 8, 8, 7, 6], 'hang', LD_HANG_NOTE); }
function ldBlankDie() { return ldDie('The Blank', [1, 1, 1, 1, 1, 1], 'blank', 'A die with every pip filed off but one, on every face. It starts as the worst die on the Row and becomes whatever you throw it into. It only fails outright on 0 or less.'); }
function ldGetBlank(paid) {
  startScreen();
  var chips = []; if (paid) applyFx({ tob: -1 }, chips);
  S.ld.dice.push(ldBlankDie()); S.ld.blankGot = true;
  resultScreen('The Blank', '', 'Jory flicks it across the step. Six faces, one pip each, filed so neatly you can still see the file marks.\n\n“Every die on the Row started somewhere,” he says. “That one starts nowhere. Throw it enough and it will become something. I just cannot tell you what.”\n\nHold it in one of your hands from the dice panel when you want it.', chips,
    [{ v: 'tally', text: 'Six pips. It will always have six pips. Only where they sit will change.' }], ldBackJory);
}
function ldHouse() { return S.ld.house || (S.ld.house = ldDie('Jory’s house die', LD_STD, 'bone', '')); }
function ldBackJory() { talk('jory', 'hub'); }
function ldRemove(di) {
  var L = S.ld; L.dice.splice(di, 1);
  L.hand = L.hand.map(function (h) { return h > di ? h - 1 : h; });
  if (L.hand[0] === di || !L.dice[L.hand[0]]) L.hand[0] = L.hand[1] === 0 ? 1 : 0;
  if (L.hand[1] === di || !L.dice[L.hand[1]] || L.hand[1] === L.hand[0]) L.hand[1] = L.hand[0] === 0 ? 1 : 0;
  if (L.ringSel >= L.dice.length) L.ringSel = 0;
}
function ldChoice(n, id, t, h, off) { return '<button class="choice' + (id === 'ldback' ? ' end' : '') + '" type="button" id="' + id + '"' + (off ? ' disabled' : '') + '><span class="t"><span class="n">' + n + '</span>' + t + '</span>' + (h ? '<span class="h">' + h + '</span>' : '') + '</button>'; }
function ldRing(log) {
  startScreen();
  var L = S.ld, day = dayNo(), won = (L.won && L.won[day]) || 0;
  if (!L.dice[L.ringSel]) L.ringSel = L.hand[0];
  var sel = L.ringSel, d = L.dice[sel], capped = won >= 6;
  var h = '<div class="eyebrow">' + clock() + ' · the yard step</div><h2>Jory’s dice ring</h2>' +
    '<div class="prose">' + paras('Table rules: you throw one die, Jory throws his house die, and the high face takes the stake. Ties go back in the pocket. He will not lose more than six tobacco to one prisoner in a day.') + '</div>' + (log || '') +
    '<div class="prompt">Throw which die?</div><div class="ldpick">' + L.dice.map(function (x, i) { return '<button type="button" class="ldsel' + (i === sel ? ' sel' : '') + '" data-lsel="' + i + '"><b>' + esc(x.name) + '</b>' + ldMini(x) + '</button>'; }).join('') + '</div>' +
    '<div class="ldvs">' + ldDieCard(d, sel, false, true) + ldDieCard(ldHouse(), -1, false, true) + '</div>' +
    '<p class="hint">Tobacco: ' + S.tob + (won ? ' · won from Jory today: ' + won : '') + '</p><div class="choices">' +
    ldChoice(1, 'ldsm', 'Small stake: 1 tobacco', capped ? 'Jory has lost enough to you today.' : '', capped || S.tob < 1) +
    ldChoice(2, 'ldbg', 'Big stake: 3 tobacco', capped ? 'Come back tomorrow.' : 'Win or lose three.', capped || S.tob < 3) +
    ldChoice(3, 'ldback', 'Step back from the ring', '', false) + '</div>';
  phase = 'talk';
  show(h);
  screen.querySelectorAll('[data-lsel]').forEach(function (b) { b.onclick = function () { L.ringSel = +b.getAttribute('data-lsel'); ldRing(log); }; });
  $('ldsm').onclick = function () { ldPlay(1); };
  $('ldbg').onclick = function () { ldPlay(3); };
  $('ldback').onclick = ldBackJory;
}
function ldPlay(stake) {
  var L = S.ld, d = L.dice[L.ringSel], me = ldThrow(d), H = ldHouse(), him = ldThrow(H), chips = [], day = dayNo();
  L.won = L.won || {};
  var res = me.v > him.v ? 'win' : me.v < him.v ? 'lose' : 'tie';
  if (res === 'win') { var room = 6 - (L.won[day] || 0), take = Math.min(stake, room); applyFx({ tob: take }, chips); L.won[day] = (L.won[day] || 0) + take; sfx('pass'); }
  else if (res === 'lose') { applyFx({ tob: -stake }, chips); sfx('fail'); }
  else sfx('blip');
  var line = '<div class="roll"><span>' + esc(d.name) + '</span><span class="die">' + me.v + '</span><span>against Jory</span><span class="die">' + him.v + '</span><span class="verdict ' + (res === 'win' ? 'ok' : 'no') + '">' + ({ win: 'You take the stake', lose: 'Jory takes the stake', tie: 'A tie: stakes back' })[res] + '</span></div>' +
    '<div class="ldnote">' + ldNote(d, me.g) + ' · ' + ldNote(H, him.g) + '</div>' + chipsHtml(chips);
  ldRing(line);
}
var LD_TRADE = [
  { n: 'A debtor’s worn die', f: [2, 2, 3, 4, 5, 5], who: 'a debtor from the common side', note: 'Rubbed smooth in a nervous palm. The ones and sixes have worn toward the middle.' },
  { n: 'A deserter’s lucky die', f: [1, 3, 3, 4, 4, 7], who: 'a deserter on the circle', note: 'Carried out of Redoubt Nine. Somebody notched the six into a seven with a nail.' },
  { n: 'A forger’s cut die', f: [0, 2, 3, 4, 5, 8], who: 'one of Tobit’s old customers', note: 'Shaved and re-inked by somebody with very steady hands. A big face, and a bad one.' },
  { n: 'A chorister’s dull die', f: [3, 3, 3, 4, 4, 4], who: 'a boy from the chapel detail', note: 'Thrown so carefully for so long that it hardly does anything any more. Safe as a hymn.' },
  { n: 'A drowned man’s die', f: [-2, 1, 3, 4, 6, 9], who: 'a river-clan prisoner', note: 'Pulled out of the Tanner along with its owner. It has seen a great deal of luck, both ways.' },
  { n: 'A turnkey’s confiscated die', f: [1, 2, 4, 4, 5, 6], who: 'a runner who should not have it', note: 'Taken off a man on the Row and sold back down it. A little better than honest.' }
];
function ldOffers() {
  var L = S.ld, day = dayNo(), s = (L.seed || 0) + day * 5, out = [];
  for (var k = 0; out.length < 3 && k < 12; k++) { var t = (s + k * 2) % LD_TRADE.length; if (out.indexOf(t) < 0) out.push(t); }
  return out.filter(function (t) { return !(L.taken && L.taken[day + ':' + t]); });
}
function ldPrice(mine, theirs) { return Math.max(-4, Math.min(6, Math.round((ldSum(theirs) - ldSum(mine.f)) / 3))); }
function ldTrade(log) {
  startScreen();
  var L = S.ld, day = dayNo();
  if (!L.dice[L.giveSel]) L.giveSel = 0;
  var give = L.dice[L.giveSel], offers = ldOffers();
  var h = '<div class="eyebrow">' + clock() + ' · the yard step</div><h2>Dice for trade</h2>' +
    '<div class="prose">' + paras('Jory brokers it, for the pleasure of watching. The Row values a die by what is on its faces, and settles the difference in tobacco. A die changes hands with its whole history.') + '</div>' + (log || '') +
    '<div class="prompt">Which of yours goes over the step?</div><div class="ldpick">' + L.dice.map(function (x, i) { return '<button type="button" class="ldsel' + (i === L.giveSel ? ' sel' : '') + '" data-lgive="' + i + '"><b>' + esc(x.name) + '</b>' + ldMini(x) + '</button>'; }).join('') + '</div>' +
    '<p class="hint">Tobacco: ' + S.tob + '</p><div class="choices">' +
    offers.map(function (t, k) {
      var T = LD_TRADE[t], p = ldPrice(give, T.f), cant = p > 0 && S.tob < p;
      var deal = p > 0 ? 'You add ' + p + ' tobacco.' : p < 0 ? 'They add ' + (-p) + ' tobacco.' : 'A straight swap.';
      return '<button class="choice" type="button" data-ltr="' + t + '"' + (cant ? ' disabled' : '') + '><span class="t"><span class="n">' + (k + 1) + '</span>' + esc(T.n) + ' ' + ldMini({ f: T.f }) + '</span><span class="h">From ' + esc(T.who) + '. ' + esc(T.note) + ' ' + deal + '</span></button>';
    }).join('') + (offers.length ? '' : '<p class="hint">Nobody else is trading today.</p>') +
    ldChoice(offers.length + 1, 'ldback', 'Back to the ring', '', false) + '</div>';
  phase = 'talk';
  show(h);
  screen.querySelectorAll('[data-lgive]').forEach(function (b) { b.onclick = function () { L.giveSel = +b.getAttribute('data-lgive'); ldTrade(log); }; });
  screen.querySelectorAll('[data-ltr]').forEach(function (b) {
    b.onclick = function () {
      if (b.disabled) return;
      var t = +b.getAttribute('data-ltr'), T = LD_TRADE[t], mine = L.dice[L.giveSel], p = ldPrice(mine, T.f), chips = [];
      if (p) applyFx({ tob: -p }, chips);
      L.taken = L.taken || {}; L.taken[day + ':' + t] = true;
      L.dice[L.giveSel] = ldDie(T.n, T.f, 'bone', T.note + ' Traded from ' + T.who + ' on day ' + day + '.');
      sfx('blip');
      ldTrade('<div class="notice">' + esc(mine.name) + ' goes over the step. ' + esc(T.n) + ' comes back.' + (mine.k === 'hang' ? ' Somebody on the Row is about to have a very good week, and then a very bad one.' : '') + '</div>' + chipsHtml(chips));
    };
  });
  $('ldback').onclick = function () { ldRing(); };
}
function ldBuyHang() {
  startScreen();
  var chips = []; applyFx({ tob: -5 }, chips);
  S.ld.dice.push(ldHangDie()); S.ld.hangGot = true;
  resultScreen('The Hangman’s Die', '', 'Five twists of tobacco go into Jory’s cap. He spits the die into his palm, wipes it on his shirt, and drops it into yours. It is warm, and it is heavier than bone should be.\n\nHold it in one of your hands from the dice panel when you want it.', chips,
    [{ v: 'choir', text: 'We know that die. Every one of us threw it once. It was very kind to us, at first.' }], ldBackJory);
}
function ldThrowHang() {
  startScreen();
  var L = S.ld, di = L.hand[0], d = L.dice[di], H = ldHouse(), me = ldThrow(d), him = ldThrow(H), win = me.v > him.v, chips = [], text;
  var line = '<div class="roll"><span>' + esc(d.name) + '</span><span class="die">' + me.v + '</span><span>against Jory</span><span class="die">' + him.v + '</span><span class="verdict ' + (win ? 'ok' : 'no') + '">' + (win ? 'You win the die' : 'Jory wins') + '</span></div><div class="ldnote">' + ldNote(d, me.g) + ' · ' + ldNote(H, him.g) + '</div>';
  if (win) {
    L.dice.push(ldHangDie()); L.hangGot = true; sfx('redpass');
    text = 'Jory looks at the dice for a long moment. Then he laughs, spits the Hangman’s Die into his palm, and pays his debt like a gentleman.\n\n“It was never mine anyway,” he says. “It is only ever passing through.”';
  } else {
